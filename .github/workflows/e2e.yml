name: E2E

# The comparison, on a fresh runner: kind, four simulated model servers, the
# llm-d router, and the same multi-turn load through the router and through a
# plain round-robin Service. Every push to main, every pull request to main,
# and every day, so a new router, simulator or chart release that changes
# the result shows up within a day. On main, on the schedule and on a
# dispatch, each check is also shown the breaks it exists for
# (tests/plants.tsv).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash with pipefail. A step that pipes a test into tee must fail when the
# test does; GitHub's default for a run step is `bash -e`, under which tee's
# exit status is the step's.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

      - name: The load generator compiles
        run: python3 -I -m py_compile loadgen/loadgen.py loadgen/probe.py tests/plant-violations.py scripts/status.py

      # The GPU run names the card it ran on (ADR 5): an L4, or the A10G
      # fallback, never one for the other. Shown its breaks here, since the
      # GPU run itself has none to spare.
      - name: The GPU run's card check, and the breaks it exists for
        run: |
          ./tests/gpu-card.sh
          PLANTS=tests/gpu-card-plants.tsv python3 -I -u tests/plant-violations.py -- bash tests/gpu-card.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # The GPU run's thresholds, replayed on the saved results of GPU runs
      # (tests/fixtures/gpu/): every working router passes, the one planted
      # to pick at random fails, on time alone too.
      - name: The GPU run's thresholds, on its saved runs, and the breaks they exist for
        run: |
          ./tests/gpu-judge.sh
          PLANTS=tests/gpu-judge-plants.tsv python3 -I -u tests/plant-violations.py -- bash tests/gpu-judge.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The GPU run's Terraform (ADR 5), checked on a plan against a mocked AWS
  # provider, and its tests shown the breaks they exist for
  # (eks/tests/plants.tsv). No account, no credential, no cost: the run
  # itself is gpu.yml.
  terraform:
    name: The GPU run's Terraform, on a plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Format, validate, test
        run: |
          terraform -chdir=eks fmt -check -recursive -diff
          terraform -chdir=eks init -backend=false -input=false -lockfile=readonly
          terraform -chdir=eks validate
          terraform -chdir=eks test

      - name: The tests, shown each break they exist for
        run: PLANTS=eks/tests/plants.tsv python3 -I -u tests/plant-violations.py -- terraform -chdir=eks test | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Prefix-aware routing against round-robin
    runs-on: ubuntu-latest
    needs: lint
    # Up and the comparison take about three minutes; the plants run both
    # again, once untouched and once for each row of tests/plants.tsv.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: kind and helm, pinned and checked
        run: |
          set -euo pipefail
          . ./images.lock
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          install -m 0755 kind "$HOME/.local/bin/kind"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256_AMD64}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          install -m 0755 linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Up
        run: ./scripts/up.sh

      # E2E_RESULTS on this step only: the plants below run the same script
      # again for each row, and a copy they wrote would be a plant's.
      - name: The comparison
        env:
          RESULTS: ${{ runner.temp }}/results
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: ${{ runner.temp }}/results/
          retention-days: 90
          if-no-files-found: ignore

      - name: The tests, shown each break they exist for
        id: plants
        if: github.event_name != 'pull_request'
        run: python3 -I -u tests/plant-violations.py -- bash -c './scripts/up.sh >/dev/null 2>&1 && ./tests/e2e.sh >/dev/null 2>&1' | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/plants.txt"

      # The plants' verdict as one more check, so a run that is red because a
      # check missed its break does not read as every check passed.
      - name: The plants' verdict, as a check
        if: always() && steps.plants.outcome != 'skipped'
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
          OUTCOME: ${{ steps.plants.outcome }}
        run: |
          [ -f "$E2E_RESULTS" ] || exit 0
          python3 -I - <<'PY'
          import json, os, re
          path, said = os.environ["E2E_RESULTS"], os.path.join(os.environ["RUNNER_TEMP"], "plants.txt")
          text = open(said, encoding="utf-8").read() if os.path.exists(said) else ""
          verdict = re.findall(r"^\d+ plants: .*$", text, re.M)
          d = json.load(open(path, encoding="utf-8"))
          d["checks"].append({"state": "PASS" if os.environ["OUTCOME"] == "success" else "FAIL",
                              "name": "every check shown the break it exists for (tests/plants.tsv): "
                                      + (verdict[-1] if verdict else "the plants did not finish")})
          json.dump(d, open(path, "w", encoding="utf-8"), indent=2)
          PY

      # What the comparison printed, as checks and measurements, and the
      # plants' verdict, for status.yml (scripts/status.py), which reads
      # main's runs only.
      - name: Keep the results for the status workflow
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
          retention-days: 30
