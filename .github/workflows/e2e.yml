name: E2E

# The comparison, on a fresh runner: kind, four simulated model servers, the
# llm-d router, and the same multi-turn load through the router and through a
# plain round-robin Service. Every push, every pull request and every day, so
# a new router, simulator or chart release that changes the result shows up
# within a day. On main and on the schedule, each check is also shown the
# breaks it exists for (tests/plants.tsv).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash with pipefail. A step that pipes a test into tee must fail when the
# test does; GitHub's default for a run step is `bash -e`, under which tee's
# exit status is the step's.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

      - name: The load generator compiles
        run: python3 -I -m py_compile loadgen/loadgen.py loadgen/probe.py tests/plant-violations.py

      # The GPU run names the card it ran on (ADR 5): an L4, or the A10G
      # fallback, never one for the other. Shown its breaks here, since the
      # GPU run itself has none to spare.
      - name: The GPU run's card check, and the breaks it exists for
        run: |
          ./tests/gpu-card.sh
          PLANTS=tests/gpu-card-plants.tsv python3 -I -u tests/plant-violations.py -- bash tests/gpu-card.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The GPU run's Terraform (ADR 5), checked on a plan against a mocked AWS
  # provider, and its tests shown the breaks they exist for
  # (eks/tests/plants.tsv). No account, no credential, no cost: the run
  # itself is gpu.yml.
  terraform:
    name: The GPU run's Terraform, on a plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Format, validate, test
        run: |
          terraform -chdir=eks fmt -check -recursive -diff
          terraform -chdir=eks init -backend=false -input=false -lockfile=readonly
          terraform -chdir=eks validate
          terraform -chdir=eks test

      - name: The tests, shown each break they exist for
        run: PLANTS=eks/tests/plants.tsv python3 -I -u tests/plant-violations.py -- terraform -chdir=eks test | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Prefix-aware routing against round-robin
    runs-on: ubuntu-latest
    needs: lint
    # Up and the comparison take about three minutes; the plants run both
    # seven more times.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: kind and helm, pinned and checked
        run: |
          set -euo pipefail
          . ./images.lock
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          install -m 0755 kind "$HOME/.local/bin/kind"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256_AMD64}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          install -m 0755 linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Up
        run: ./scripts/up.sh

      - name: The comparison
        env:
          RESULTS: ${{ runner.temp }}/results
        run: ./tests/e2e.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: ${{ runner.temp }}/results/
          retention-days: 90
          if-no-files-found: ignore

      - name: The tests, shown each break they exist for
        if: github.event_name != 'pull_request'
        run: python3 -I -u tests/plant-violations.py -- bash -c './scripts/up.sh >/dev/null 2>&1 && ./tests/e2e.sh >/dev/null 2>&1' | tee -a "$GITHUB_STEP_SUMMARY"
