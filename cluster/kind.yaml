# One node: the comparison is between two ways of routing the same four
# model servers, so it needs no more than the node they share.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # kind v0.33.0's default node for Kubernetes v1.37.0, from its release
    # notes, pinned: the images kind's own pods run are inside it. The same
    # value is KIND_NODE_IMAGE in images.lock, and scripts/up.sh refuses a
    # cluster/kind.yaml that names another.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
