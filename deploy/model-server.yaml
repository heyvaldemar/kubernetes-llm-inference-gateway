# Four model servers, simulated: llm-d-inference-sim speaks vLLM's OpenAI API
# and metrics, keeps a prefix KV cache per replica, and charges prefill time
# only for the prompt tokens that cache does not hold:
#   prefill = prefill-overhead + (prompt tokens - cached tokens) x prefill-time-per-token
# so a request routed to the replica that already holds its conversation's
# prefix answers sooner, exactly as on a GPU, and with nothing random in it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  labels:
    app: model-server
spec:
  replicas: 4
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0@sha256:1908c421cbb44130a3212934a0dd1e279dacfe3480be93f4c28b45cd29b93ec8
          args:
            - --model=sim/model
            - --port=8000
            - --mode=random
            - --enable-kvcache
            - --kv-cache-size=1024
            - --block-size=16
            - --prefill-overhead=20ms
            - --prefill-time-per-token=1ms
            - --inter-token-latency=10ms
            - --max-num-seqs=8
            # vLLM's context window; the simulator's default (1024) is shorter
            # than an eight-turn conversation and answers 400 past it.
            - --max-model-len=8192
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
# The baseline: the same four replicas behind a plain Service, so kube-proxy
# picks one at random for every connection, as any HTTP load balancer would.
apiVersion: v1
kind: Service
metadata:
  name: model-server-roundrobin
spec:
  selector:
    app: model-server
  ports:
    - name: http
      port: 8000
      targetPort: http
